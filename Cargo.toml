[package]
name = "yot-server"
version = "1.2.3"
edition = "2024"

[[bin]]
name = "yot-server"
path = "src/bin/yot_server.rs"

[[bin]]
name = "yot-mcp"
path = "src/bin/yot_mcp.rs"

[[bin]]
name = "yot"
path = "src/bin/yot_cli.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "set-header"] }
rusqlite = { version = "0.35", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["rustls-tls", "blocking", "json"], default-features = false }
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
http = "1"
regex-lite = "0.1"
url = "2"
rust-embed = "8.12.0"
mime_guess = "2.0.5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
