name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-amd64
            ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-arm64
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-amd64
            ext: zip
          - target: x86_64-apple-darwin
            os: macos-latest
            name: darwin-amd64
            ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            name: darwin-arm64
            ext: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.ext == 'tar.gz'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/yot-server staging/
          cp target/${{ matrix.target }}/release/yot-mcp staging/
          cp target/${{ matrix.target }}/release/yot staging/
          cp dist/yot-server.service staging/
          tar czf yot-${{ matrix.name }}.tar.gz -C staging .

      - name: Package (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging
          Copy-Item "target/${{ matrix.target }}/release/yot-server.exe" staging/
          Copy-Item "target/${{ matrix.target }}/release/yot-mcp.exe" staging/
          Copy-Item "target/${{ matrix.target }}/release/yot.exe" staging/
          Compress-Archive -Path staging/* -DestinationPath "yot-${{ matrix.name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yot-${{ matrix.name }}
          path: yot-${{ matrix.name }}.${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            yot-*.tar.gz
            yot-*.zip
